name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Rebuild the examples
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck sources
        run: npm run typecheck

      - name: Compile and prepare gallery
        run: npm run build

      - name: Install GIF encoder
        run: brew install ffmpeg

      - name: Test GIF quality, size and failure handling
        run: npm test

      - name: Dial indicator
        run: |
          node dist/examples/dial-indicator/build.js
          node dist/examples/dial-indicator/build.js --light

      - name: Desk computer
        run: |
          node dist/examples/desk-computer/build.js
          node dist/examples/desk-computer/build.js --light

      - name: Arcade cabinet
        run: |
          node dist/examples/arcade-cabinet/build.js
          node dist/examples/arcade-cabinet/build.js --light

      - name: Ripple tank
        run: |
          node dist/examples/ripple-tank/build.js
          node dist/examples/ripple-tank/build.js --light

      - name: Turning dial
        run: |
          node dist/examples/turning-dial/build.js
          node dist/examples/turning-dial/build.js --light
          node dist/examples/turning-dial/build.js --light --verify
          node dist/examples/turning-dial/stress.js --light

      - name: Raptor engine
        run: |
          node dist/examples/raptor-engine/build.js
          node dist/examples/raptor-engine/build.js --light

      - name: Sources and reference pages are unchanged
        run: |
          git status --short
          git diff --stat --exit-code
          test -z "$(git status --porcelain)"

  browser:
    name: Export GIFs from every scene and theme
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
